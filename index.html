<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>What if... 🐒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lime:#a9cc3b;
    --lime-deep:#8fb02a;
    --magenta:#d91c6b;
    --magenta-deep:#b21457;
    --indigo:#241a52;
    --cream:#fff9ec;
    --ink:#1c1508;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    font-family:'Fredoka',sans-serif;
    background:var(--indigo);
    overflow:hidden;
    color:var(--ink);
  }
  #stage{
    position:relative;
    height:100vh;
    width:100vw;
    overflow:hidden;
  }

  /* ---------- background photo ---------- */
  #photo{
    position:absolute;
    inset:0;
    background-image:url('photo.jpg');
    background-size:cover;
    background-position:center 30%;
    filter:blur(22px) brightness(0.55) saturate(0.9);
    transform:scale(1.08);
    transition:filter 1.6s ease, transform 1.6s ease;
  }
  #stage.unlocked #photo{
    filter:blur(0px) brightness(0.72) saturate(1.05);
    transform:scale(1);
  }
  #photo::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(18,12,30,0.15) 0%, rgba(18,12,30,0.15) 45%, rgba(18,12,30,0.85) 100%);
    opacity:0;
    transition:opacity 1.4s ease 0.4s;
  }
  #stage.unlocked #photo::after{ opacity:1; }

  /* ---------- hands covering "eyes" ---------- */
  .hand{
    position:absolute;
    top:18%;
    width:38%;
    height:46%;
    background:linear-gradient(135deg, var(--magenta) 0%, var(--magenta-deep) 100%);
    box-shadow: inset 0 0 0 6px rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.35);
    transition: transform 1.1s cubic-bezier(.34,1.56,.64,1), opacity 0.9s ease;
    z-index:5;
  }
  #handL{
    left:-4%;
    border-radius: 40% 60% 55% 45% / 60% 50% 50% 40%;
    transform-origin: bottom right;
  }
  #handR{
    right:-4%;
    border-radius: 60% 40% 45% 55% / 50% 60% 40% 50%;
    transform-origin: bottom left;
  }
  .hand::before{
    content:'';
    position:absolute;
    bottom:-6%;
    left:15%;
    width:70%;
    height:35%;
    background:inherit;
    border-radius:50% 50% 40% 40%;
  }
  #stage.unlocked #handL{
    transform: translate(-115%, -10%) rotate(-25deg);
    opacity:0;
  }
  #stage.unlocked #handR{
    transform: translate(115%, -10%) rotate(25deg);
    opacity:0;
  }

  /* ---------- gate card ---------- */
  #gate{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    padding:24px;
    transition: opacity 0.7s ease, visibility 0.7s;
  }
  #stage.unlocked #gate{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #card{
    background:var(--cream);
    border-radius:26px;
    padding:34px 30px 30px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,0.45);
    border:3px solid var(--ink);
    position:relative;
  }
  #card .eyebrow{
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--magenta-deep);
    font-weight:600;
    margin-bottom:6px;
  }
  #card h1{
    font-family:'Caveat',cursive;
    font-size:44px;
    line-height:1.05;
    margin:0 0 18px;
    color:var(--indigo);
    font-weight:700;
  }
  #card p.question{
    font-size:17px;
    font-weight:500;
    margin:0 0 18px;
    color:var(--ink);
  }
  #answer{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:2px solid var(--indigo);
    font-family:'Fredoka',sans-serif;
    font-size:16px;
    outline:none;
    text-align:center;
    background:#fff;
  }
  #answer:focus{ border-color:var(--magenta); }
  #submit{
    margin-top:14px;
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:none;
    background:var(--indigo);
    color:var(--lime);
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  #submit:hover{ background:#332268; }
  #submit:active{ transform:scale(0.97); }
  #hint{
    margin-top:12px;
    font-size:13px;
    color:#8a7f66;
  }
  .shake{ animation:shake 0.5s; }
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }

  /* ---------- revealed message ---------- */
  #reveal{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:6;
    padding:0 28px;
    text-align:center;
    opacity:0;
    transition:opacity 1.4s ease 1.1s;
  }
  #stage.unlocked #reveal{ opacity:1; }
  #reveal .msg{
    font-family:'Caveat',cursive;
    font-weight:600;
    color:var(--cream);
    font-size:clamp(28px, 5.4vw, 46px);
    line-height:1.25;
    text-shadow:0 4px 18px rgba(0,0,0,0.55);
    max-width:640px;
    margin:0 auto;
  }
  #reveal .signoff{
    margin-top:10px;
    font-family:'Fredoka',sans-serif;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--lime);
    opacity:0.9;
  }

  /* ---------- music control ---------- */
  #musicBar{
    position:absolute;
    top:20px; left:20px;
    z-index:8;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(20,14,8,0.45);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:999px;
    padding:8px 16px 8px 8px;
    opacity:0;
    transform:translateY(-10px);
    transition:opacity 1s ease 1.6s, transform 1s ease 1.6s;
  }
  #stage.unlocked #musicBar{ opacity:1; transform:translateY(0); }
  #playToggle{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--lime);
    color:var(--indigo);
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #trackLabel{
    color:var(--cream);
    font-size:12.5px;
    font-weight:500;
    max-width:150px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  @media (max-width:520px){
    .hand{ width:48%; height:40%; top:14%; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="photo"></div>
  <div class="hand" id="handL"></div>
  <div class="hand" id="handR"></div>

  <div id="gate">
    <div id="card">
      <div class="eyebrow">psst 🙈</div>
      <h1>What if...</h1>
      <p class="question">When did our dancing vibes match?</p>
      <input type="text" id="answer" placeholder="dd/mm/yyyy" autocomplete="off">
      <button id="submit">Open my eyes</button>
      <div id="hint"></div>
    </div>
  </div>

  <div id="reveal">
    <div class="msg">Forgetting your eyes was never an option... Happy Birthday, sweet monkey 🐒</div>
    <div class="signoff">tap the note to play our song</div>
  </div>

  <div id="musicBar">
    <button id="playToggle">▶</button>
    <div id="trackLabel">Happy Birthday</div>
  </div>
</div>

<audio id="audio" loop preload="auto">
  <source src="Happy Birthday_ Sweet monkey.mp3" type="audio/mpeg">
</audio>

<script>
  const ACCEPTED = ["23/5/2026","23/05/2026","23-5-2026","23-05-2026","2352026"];

  function normalize(v){
    return v.trim().toLowerCase()
      .replace(/[.\s]/g,'/')
      .replace(/-/g,'/')
      .replace(/\/+/g,'/')
      .replace(/^0+(\d)/,'$1')
      .replace(/\/0+(\d)/g,'/$1');
  }

  const stage = document.getElementById('stage');
  const input = document.getElementById('answer');
  const card = document.getElementById('card');
  const hint = document.getElementById('hint');
  const audio = document.getElementById('audio');
  const playToggle = document.getElementById('playToggle');

  function tryUnlock(){
    const val = normalize(input.value);
    const ok = ACCEPTED.some(a => normalize(a) === val || a.replace(/\D/g,'') === input.value.replace(/\D/g,''));
    if(ok){
      stage.classList.add('unlocked');
      audio.volume = 0.85;
      audio.play().then(()=>{ playToggle.textContent = '⏸'; }).catch(()=>{ playToggle.textContent = '▶'; });
    } else {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      hint.textContent = 'not quite... try again 🙈';
    }
  }

  document.getElementById('submit').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryUnlock(); });

  playToggle.addEventListener('click', ()=>{
    if(audio.paused){
      audio.play();
      playToggle.textContent = '⏸';
    } else {
      audio.pause();
      playToggle.textContent = '▶';
    }
  });
</script>

</body>
</html>
