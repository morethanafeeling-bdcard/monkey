<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Centered Message</title>
  <style>
    /* Fill the viewport and remove default spacing */
    html, body {
      height: 100%;
      margin: 0;
    }

    /* Center content horizontally and vertically */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f9fc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    /* Message box styling */
    .message {
      padding: 2rem 2.5rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(16,24,40,0.08);
      text-align: center;
      max-width: 90%;
      color: #0f172a;
    }

    .message h1 {
      margin: 0 0 0.5rem 0;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      line-height: 1.1;
    }

    .message p {
      margin: 0;
      font-size: clamp(0.95rem, 1.8vw, 1.05rem);
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="message" role="status" aria-live="polite">
    <h1>Your message here</h1>
    <p>This message is centered both vertically and horizontally.</p>
  </div>
</body>
</html>
